@if (note()) {
  <p class="note">{{ note() }}</p>
}

<div
  class="card"
  [class.card--hidden]="state() === 'failed'"
  [attr.aria-busy]="state() === 'loading'"
>
  <!-- HubSpot renders the form inside this element; Angular never touches its children. -->
  <div
    #frame
    class="hs-form-frame"
    data-testid="hubspot-frame"
    [attr.data-region]="config.region"
    [attr.data-form-id]="config.formId"
    [attr.data-portal-id]="config.portalId"
  ></div>

  @if (state() === 'loading') {
    <div class="loading" role="status">
      <span class="spinner" aria-hidden="true"></span>
      Loading the form…
    </div>
  }
</div>

@if (state() === 'failed') {
  <div class="fallback" role="status" data-testid="hubspot-fallback">
    <i class="ph ph-warning-circle" aria-hidden="true"></i>
    <p>
      The form couldn't load — an ad or tracker blocker may be stopping it.
      <a [href]="'mailto:' + email + '?subject=Hello%20Erika'">Email me instead</a>.
    </p>
  </div>
} @else {
  <p class="alt">
    Prefer email? <a [href]="'mailto:' + email">{{ email }}</a>
  </p>
}
