<!doctype html>
<html lang="en" data-mode="pro">
  <head>
    <meta charset="utf-8" />
    <title>Erika Fulgencio</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Erika Fulgencio — ISTQB-certified Senior QA Engineer and QA Lead in Manila. Projects, case studies, skills and a game-styled alter ego."
    />
    <meta name="theme-color" content="#f2f1f6" />
    <!-- Privacy: findable on search engines, but no cached copies, text snippets or image indexing,
         and an opt-out from AI training and text-and-data mining (TDMRep, EU DSM Directive Art. 4).
         AI crawlers that only read robots.txt are covered by the domain-root robots.txt. -->
    <meta
      name="robots"
      content="index, follow, noarchive, nosnippet, noimageindex, max-image-preview:none, noai, noimageai"
    />
    <meta name="tdm-reservation" content="1" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Erika Fulgencio" />
    <meta
      property="og:description"
      content="There's more to it than meets the eye. Test strategy, QA leadership, automation and AI-driven testing."
    />
    <meta
      property="og:image"
      content="https://erikafulgencio.github.io/qa-portfolio/assets/img/erika-portrait.jpg"
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      // Apply the saved mode before first paint so there is no theme flash.
      (function () {
        var m = 'pro';
        try {
          m = localStorage.getItem('ef-mode') === 'alter' ? 'alter' : 'pro';
        } catch (e) {}
        document.documentElement.setAttribute('data-mode', m);
      })();
    </script>
    <style>
      /* Boot loader: the brand monogram assembles itself — the diamond draws, the "E" follows, then
         the hot middle bar shoots out to the diamond's point like a scan finding its defect. */
      #pl-loader {
        --pl-bg: #f2f1f6;
        --pl-glow-1: #8b6cea;
        --pl-glow-2: #c9678f;
        --pl-line: #6d4bd6;
        --pl-hot: #c9678f;
        --pl-name: #221c33;
        --pl-sub: #5f587a;
        --pl-msg: #77708f;
        --pl-track: #dcd8e8;
        --pl-scan: rgba(109, 75, 214, 0.22);
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        background: var(--pl-bg);
        transition:
          opacity 0.45s ease 0.15s,
          visibility 0.45s 0.15s;
      }
      #pl-loader.alter {
        --pl-bg: #0c0e1a;
        --pl-glow-1: #78dcff;
        --pl-glow-2: #ff3c6a;
        --pl-line: #78dcff;
        --pl-hot: #ff3c6a;
        --pl-name: #e9e9ed;
        --pl-sub: #8f93ad;
        --pl-msg: #7d819e;
        --pl-track: #23273d;
        --pl-scan: rgba(120, 220, 255, 0.28);
      }
      #pl-loader.enter {
        opacity: 0;
        transition: opacity 0.35s ease;
      }
      #pl-loader.out {
        opacity: 0;
        visibility: hidden;
      }
      /* Cropped to the mark and its text, sized to the screen; the glow spills past the edges. */
      #pl-loader svg {
        position: absolute;
        left: 50%;
        top: 50%;
        width: min(84vw, 380px);
        height: auto;
        transform: translate(-50%, -52%);
        overflow: visible;
      }
      #pl-loader .pl-fit {
        transform-box: fill-box;
        transform-origin: center;
      }
      /* Assembly (stroke lengths are in monogram units: diamond 122, E strokes 19/16, bar 30). */
      #pl-loader .pl-dia {
        stroke-dasharray: 122;
        stroke-dashoffset: 122;
        animation: pl-draw 0.62s cubic-bezier(0.65, 0, 0.35, 1) 0.05s forwards;
      }
      #pl-loader .pl-e {
        stroke-dasharray: 19;
        stroke-dashoffset: 19;
        animation: pl-draw 0.26s ease-out forwards;
      }
      #pl-loader .pl-e1 {
        animation-delay: 0.32s;
      }
      #pl-loader .pl-e2 {
        animation-delay: 0.44s;
      }
      #pl-loader .pl-e3 {
        animation-delay: 0.52s;
      }
      #pl-loader .pl-bar {
        transform-box: fill-box;
        transform-origin: left center;
        transform: scaleX(0);
        animation: pl-shoot 0.34s cubic-bezier(0.2, 0.8, 0.2, 1) 0.62s forwards;
      }
      #pl-loader .pl-spark {
        transform-box: fill-box;
        transform-origin: center;
        opacity: 0;
        animation: pl-spark 2.4s ease-out 0.9s infinite;
      }
      /* While loading: breathing glow, orbiting inspection dots, a scan sweeping the mark. */
      #pl-loader .pl-glow {
        animation: pl-breathe 2.4s ease-in-out infinite;
      }
      #pl-loader .pl-orbit {
        transform-box: view-box;
        transform-origin: 400px 318px;
        animation: pl-orbit 5.5s linear infinite;
      }
      #pl-loader .pl-sweep {
        animation: pl-sweep 2.2s cubic-bezier(0.45, 0, 0.55, 1) 0.95s infinite;
        transform: translateX(-40px);
      }
      #pl-loader .pl-mark {
        animation: pl-in 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      #pl-loader .pl-txt {
        animation: pl-rise 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) 0.45s both;
      }
      #pl-loader .pl-mark,
      #pl-loader .pl-txt {
        transition:
          transform 0.55s cubic-bezier(0.7, 0, 0.3, 1),
          opacity 0.4s ease;
      }
      /* Alter Ego: HUD brackets lock on and the bar glitches. */
      #pl-loader .pl-hud {
        display: none;
      }
      #pl-loader.alter .pl-hud {
        display: inline;
        animation: pl-lock 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) 0.2s both;
      }
      #pl-loader.alter .pl-bar {
        animation:
          pl-shoot 0.34s cubic-bezier(0.2, 0.8, 0.2, 1) 0.62s forwards,
          pl-glitch 2.4s steps(1) 1.2s infinite;
      }
      /* Exit: the mark lifts away as the backdrop dissolves. */
      #pl-loader.out .pl-mark {
        transform: translateY(-14px) scale(1.06);
        opacity: 0;
      }
      #pl-loader.out .pl-txt {
        transform: translateY(10px);
        opacity: 0;
      }
      /* Fast variant (a reload in the same session, or a mode swap): the mark is already drawn. */
      #pl-loader.fast .pl-dia,
      #pl-loader.fast .pl-e {
        animation-duration: 0.01s;
        animation-delay: 0s;
      }
      #pl-loader.fast .pl-bar {
        animation-duration: 0.2s;
        animation-delay: 0.05s;
      }
      @keyframes pl-draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes pl-shoot {
        to {
          transform: scaleX(1);
        }
      }
      @keyframes pl-spark {
        0% {
          opacity: 0.95;
          transform: scale(0.4);
        }
        35% {
          opacity: 0;
          transform: scale(2.6);
        }
        100% {
          opacity: 0;
          transform: scale(2.6);
        }
      }
      @keyframes pl-breathe {
        0%,
        100% {
          opacity: 0.65;
        }
        50% {
          opacity: 1;
        }
      }
      @keyframes pl-orbit {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes pl-sweep {
        0% {
          transform: translateX(-40px);
        }
        60%,
        100% {
          transform: translateX(150px);
        }
      }
      @keyframes pl-in {
        from {
          opacity: 0;
          transform: scale(0.92);
        }
      }
      @keyframes pl-rise {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
      }
      @keyframes pl-lock {
        from {
          opacity: 0;
          transform: scale(1.35);
        }
      }
      @keyframes pl-glitch {
        0%,
        88%,
        100% {
          opacity: 1;
        }
        90% {
          opacity: 0.2;
        }
        93% {
          opacity: 1;
        }
        95% {
          opacity: 0.45;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #pl-loader * {
          animation: none !important;
        }
        #pl-loader .pl-dia,
        #pl-loader .pl-e {
          stroke-dashoffset: 0;
        }
        #pl-loader .pl-bar {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <script>
      // window.__efLoader.show(mode, { swap, onCovered }) / .ready() — driven by LoaderService.
      (function () {
        // The brand monogram (same geometry as shared/monogram.ts), drawn at 3x on an 800x800 stage.
        var MONO = 'ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';
        var SANS = 'Segoe UI,Helvetica Neue,Helvetica,Arial,sans-serif';
        var MARK = 'transform="translate(328 246) scale(3)"';
        // HUD corner brackets (Alter Ego), around the 144px mark.
        var HUD =
          '<g class="pl-hud pl-fit" fill="none" stroke="var(--pl-line)" stroke-width="2" stroke-opacity=".8">' +
          '<path d="M300 268V246H322M478 246H500V268M500 368V390H478M322 390H300V368"/></g>';
        var SVG =
          '<svg viewBox="250 190 300 380" aria-hidden="true">' +
          '<defs>' +
          '<radialGradient id="pl-g1" gradientUnits="userSpaceOnUse" cx="360" cy="300" r="300"><stop offset="0" stop-color="var(--pl-glow-1)" stop-opacity=".2"/><stop offset="1" stop-color="var(--pl-glow-1)" stop-opacity="0"/></radialGradient>' +
          '<radialGradient id="pl-g2" gradientUnits="userSpaceOnUse" cx="450" cy="350" r="280"><stop offset="0" stop-color="var(--pl-glow-2)" stop-opacity=".16"/><stop offset="1" stop-color="var(--pl-glow-2)" stop-opacity="0"/></radialGradient>' +
          '<linearGradient id="pl-gb" gradientUnits="userSpaceOnUse" x1="330" x2="470" y1="0" y2="0"><stop offset="0" stop-color="var(--pl-line)"/><stop offset="1" stop-color="var(--pl-hot)"/></linearGradient>' +
          '<linearGradient id="pl-gs" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="var(--pl-scan)" stop-opacity="0"/><stop offset=".5" stop-color="var(--pl-scan)"/><stop offset="1" stop-color="var(--pl-scan)" stop-opacity="0"/></linearGradient>' +
          '<clipPath id="pl-clip"><path d="M24 2.5 L45.5 24 L24 45.5 L2.5 24 Z"/></clipPath>' +
          '</defs>' +
          '<g class="pl-glow"><rect x="-20000" y="-20000" width="40800" height="40800" fill="url(#pl-g1)"/>' +
          '<rect x="-20000" y="-20000" width="40800" height="40800" fill="url(#pl-g2)"/></g>' +
          '<g class="pl-mark pl-fit">' +
          HUD +
          // Orbiting inspection dots.
          '<g class="pl-orbit"><circle cx="400" cy="318" r="104" fill="none" stroke="var(--pl-line)" stroke-opacity=".12" stroke-dasharray="2 7"/>' +
          '<circle cx="400" cy="214" r="3.2" fill="var(--pl-line)"/><circle cx="400" cy="422" r="2.4" fill="var(--pl-hot)"/></g>' +
          '<g ' +
          MARK +
          ' fill="none" stroke-linecap="square">' +
          '<g clip-path="url(#pl-clip)"><rect class="pl-sweep" x="0" y="0" width="18" height="48" fill="url(#pl-gs)" stroke="none"/></g>' +
          '<path class="pl-dia" d="M24 2.5 L45.5 24 L24 45.5 L2.5 24 Z" stroke="var(--pl-line)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>' +
          '<path class="pl-e pl-e1" d="M15 14.5 V33.5" stroke="var(--pl-line)" stroke-width="2.3"/>' +
          '<path class="pl-e pl-e2" d="M15 15.5 H31" stroke="var(--pl-line)" stroke-width="2.3"/>' +
          '<path class="pl-e pl-e3" d="M15 32.5 H31" stroke="var(--pl-line)" stroke-width="2.3"/>' +
          '<path class="pl-bar" d="M15 24 H45" stroke="var(--pl-hot)" stroke-width="2.3"/>' +
          '<circle class="pl-spark" cx="45" cy="24" r="1.6" fill="var(--pl-hot)" stroke="none"/>' +
          '</g></g>' +
          '<g class="pl-txt pl-fit">' +
          '<text x="400" y="470" text-anchor="middle" font-family="' +
          SANS +
          '" font-size="17" font-weight="600" letter-spacing="7" fill="var(--pl-name)">ERIKA FULGENCIO</text>' +
          '<text x="400" y="496" text-anchor="middle" font-family="' +
          MONO +
          '" font-size="10.5" letter-spacing="3.5" fill="var(--pl-sub)" class="pl-role"></text>' +
          '<rect x="330" y="524" width="140" height="2" rx="1" fill="var(--pl-track)"/><rect class="pl-bar-fill" x="330" y="524" width="0" height="2" rx="1" fill="url(#pl-gb)"/>' +
          '<text x="400" y="550" text-anchor="middle" font-family="' +
          MONO +
          '" font-size="9" letter-spacing="3" fill="var(--pl-msg)"><tspan class="pl-msg">LOADING</tspan><tspan class="pl-pct" dx="6"></tspan></text>' +
          '</g></svg>';

        var appReady = false;
        var state = null;

        function show(mode, opt) {
          opt = opt || {};
          var old = document.getElementById('pl-loader');
          if (old) old.remove();
          var d = document.createElement('div');
          d.id = 'pl-loader';
          d.setAttribute('role', 'status');
          d.setAttribute('aria-label', 'Loading');
          // The full assembly plays once per session; reloads and mode swaps use the fast variant.
          var seen = false;
          try {
            seen = sessionStorage.getItem('ef-booted') === '1';
            sessionStorage.setItem('ef-booted', '1');
          } catch (e) {}
          var fast = opt.swap || seen;
          d.className =
            (mode === 'alter' ? 'alter' : 'pro') +
            (opt.swap ? ' enter' : '') +
            (fast ? ' fast' : '');
          d.innerHTML = SVG;
          d.querySelector('.pl-role').textContent =
            mode === 'alter' ? 'THE GLITCHBANE \u00b7 LV.08' : 'SENIOR QA ENGINEER';
          document.body.appendChild(d);
          var bar = d.querySelector('.pl-bar-fill');
          var pct = d.querySelector('.pl-pct');
          var msg = d.querySelector('.pl-msg');
          var t0 = performance.now();
          var minT = opt.swap ? 900 : fast ? 250 : 950;
          var p = 0;
          var ended = false;
          state = { covered: !opt.swap, swap: !!opt.swap };
          if (opt.swap) {
            d.offsetWidth; // reflow so the fade-in transition runs
            d.classList.remove('enter');
            setTimeout(function () {
              state.covered = true;
              try {
                if (opt.onCovered) opt.onCovered();
              } catch (e) {
                console.error(e);
              }
            }, 380);
          }
          function end() {
            if (ended) return;
            ended = true;
            msg.textContent = 'READY';
            pct.textContent = '';
            setTimeout(function () {
              d.classList.add('out');
              setTimeout(function () {
                d.remove();
              }, 800);
            }, 140);
          }
          function tick(now) {
            var el = Math.max(0, now - t0); // the first rAF timestamp can predate t0
            var loaded = state.swap || appReady;
            var goal = loaded && state.covered && el > minT ? 1 : Math.min(0.9, el / (minT + 300));
            p += (goal - p) * 0.16;
            if (goal === 1 && p > 0.995) p = 1;
            bar.setAttribute('width', (140 * Math.max(0, p)).toFixed(1));
            pct.textContent = Math.round(p * 100) + '%';
            if (p >= 1) return end();
            requestAnimationFrame(tick);
          }
          requestAnimationFrame(tick);
          setTimeout(end, 9000);
        }

        window.__efLoader = {
          show: show,
          ready: function () {
            appReady = true;
          },
        };
        show(document.documentElement.getAttribute('data-mode'));
      })();
    </script>
    <app-root></app-root>
    <noscript>This portfolio needs JavaScript to run.</noscript>
  </body>
</html>
