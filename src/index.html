<!doctype html>
<html lang="en" data-mode="pro">
  <head>
    <meta charset="utf-8" />
    <title>Erika Fulgencio</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Erika Fulgencio — ISTQB-certified Senior QA Engineer and QA Lead in Manila. Projects, case studies, skills and a game-styled alter ego."
    />
    <meta name="theme-color" content="#f2f1f6" />
    <!-- Privacy: findable on search engines, but no cached copies, text snippets or image indexing,
         and an opt-out from AI training and text-and-data mining (TDMRep, EU DSM Directive Art. 4).
         AI crawlers that only read robots.txt are covered by the domain-root robots.txt. -->
    <meta
      name="robots"
      content="index, follow, noarchive, nosnippet, noimageindex, max-image-preview:none, noai, noimageai"
    />
    <meta name="tdm-reservation" content="1" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Erika Fulgencio" />
    <meta
      property="og:description"
      content="There's more to it than meets the eye. Test strategy, QA leadership, automation and AI-driven testing."
    />
    <meta
      property="og:image"
      content="https://erikafulgencio.github.io/qa-portfolio/assets/img/erika-portrait.jpg"
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      // Apply the saved mode before first paint so there is no theme flash.
      (function () {
        var m = 'pro';
        try {
          m = localStorage.getItem('ef-mode') === 'alter' ? 'alter' : 'pro';
        } catch (e) {}
        document.documentElement.setAttribute('data-mode', m);
      })();
    </script>
    <style>
      /* Boot loader: quiet and classic. The monogram draws itself in a fine line, the name and
         title fade in beneath it, and a hairline fills with real progress. Inline, so it paints
         before Angular boots. */
      #pl-loader {
        --pl-bg: #f4f3f8;
        --pl-glow: rgba(109, 75, 214, 0.06);
        --pl-line: #6d4bd6;
        --pl-hot: #c9678f;
        --pl-name: #221c33;
        --pl-sub: #6b6485;
        --pl-track: rgba(34, 28, 51, 0.1);
        --pl-trace: #c9678f;
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: grid;
        place-items: center;
        background:
          radial-gradient(60% 50% at 50% 45%, var(--pl-glow), transparent 70%), var(--pl-bg);
        transition:
          opacity 0.5s ease,
          visibility 0s 0.5s;
      }
      #pl-loader.alter {
        --pl-bg: #0b0d18;
        --pl-glow: rgba(120, 220, 255, 0.05);
        --pl-line: #78dcff;
        --pl-hot: #ff3c6a;
        --pl-name: #e9e9ed;
        --pl-sub: #8f93ad;
        --pl-track: rgba(233, 233, 237, 0.12);
        --pl-trace: #b6ecff;
      }
      #pl-loader.enter {
        opacity: 0;
        transition: opacity 0.35s ease;
      }
      #pl-loader.out {
        opacity: 0;
        visibility: hidden;
      }
      #pl-loader .pl-col {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: -4vh;
        transition: transform 0.5s ease;
      }
      #pl-loader.out .pl-col {
        transform: translateY(-6px);
      }
      #pl-loader .pl-mark {
        width: 64px;
        height: 64px;
        overflow: visible;
      }
      #pl-loader .pl-mark path {
        fill: none;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
      }
      #pl-loader .pl-dia {
        stroke: var(--pl-line);
        stroke-width: 1;
        stroke-linejoin: round;
        animation: pl-draw 1.1s cubic-bezier(0.65, 0, 0.35, 1) 0.1s forwards;
      }
      #pl-loader .pl-e {
        stroke: var(--pl-line);
        stroke-width: 1.8;
        animation: pl-draw 0.45s ease-out forwards;
      }
      #pl-loader .pl-e1 {
        animation-delay: 0.65s;
      }
      #pl-loader .pl-e2 {
        animation-delay: 0.8s;
      }
      #pl-loader .pl-e3 {
        animation-delay: 0.9s;
      }
      #pl-loader .pl-bar {
        stroke: var(--pl-hot);
        stroke-width: 1.8;
        animation: pl-draw 0.6s cubic-bezier(0.65, 0, 0.35, 1) 1.05s forwards;
      }
      /* Once drawn, the mark comes alive: it floats gently, a short light glides around the
         diamond, and a soft halo behind the accent bar breathes. */
      #pl-loader .pl-mark {
        animation: pl-float 4.4s ease-in-out 1.7s infinite;
      }
      #pl-loader .pl-mark .pl-trace {
        stroke: var(--pl-trace);
        stroke-width: 1.3;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 0.12 0.88;
        stroke-dashoffset: 1;
        opacity: 0;
        animation:
          pl-fade 0.7s ease 1.3s forwards,
          pl-trace 3.4s linear 1.3s infinite;
      }
      #pl-loader .pl-mark .pl-glow {
        stroke: var(--pl-hot);
        stroke-width: 5;
        stroke-linecap: round;
        stroke-dasharray: none;
        stroke-dashoffset: 0;
        opacity: 0;
        animation: pl-breathe 3s ease-in-out 1.7s infinite;
      }
      #pl-loader .pl-name {
        margin: 30px 0 0;
        font:
          400 15px/1 'Inter',
          'Segoe UI',
          'Helvetica Neue',
          Arial,
          sans-serif;
        letter-spacing: 0.34em;
        text-indent: 0.34em; /* balances the trailing letter-spacing so the name sits centred */
        color: var(--pl-name);
        opacity: 0;
        animation: pl-rise 0.9s ease 0.45s forwards;
      }
      #pl-loader .pl-role {
        margin: 12px 0 0;
        font:
          400 10px/1 ui-monospace,
          'SFMono-Regular',
          Menlo,
          Consolas,
          monospace;
        letter-spacing: 0.3em;
        text-indent: 0.3em;
        color: var(--pl-sub);
        opacity: 0;
        animation: pl-rise 0.9s ease 0.65s forwards;
      }
      #pl-loader .pl-track {
        width: 88px;
        height: 1px;
        margin-top: 30px;
        overflow: hidden;
        background: var(--pl-track);
        opacity: 0;
        animation: pl-fade 0.6s ease 0.8s forwards;
      }
      #pl-loader .pl-fill {
        height: 100%;
        background: var(--pl-line);
        transform: scaleX(0);
        transform-origin: left center;
      }
      /* A reload in the same session, or a mode swap: everything is already in place. */
      #pl-loader.fast .pl-mark path,
      #pl-loader.fast .pl-name,
      #pl-loader.fast .pl-role,
      #pl-loader.fast .pl-track {
        animation-duration: 0.01s;
        animation-delay: 0s;
      }
      #pl-loader.fast .pl-mark,
      #pl-loader.fast .pl-mark .pl-glow {
        animation-delay: 0.1s;
      }
      #pl-loader.fast .pl-mark .pl-trace {
        animation-duration: 0.4s, 3.4s;
        animation-delay: 0.1s, 0.1s;
      }
      @keyframes pl-draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes pl-rise {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes pl-fade {
        to {
          opacity: 1;
        }
      }
      @keyframes pl-trace {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes pl-breathe {
        0%,
        100% {
          opacity: 0;
        }
        50% {
          opacity: 0.22;
        }
      }
      @keyframes pl-float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-3px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #pl-loader * {
          animation: none !important;
        }
        #pl-loader .pl-mark path {
          stroke-dashoffset: 0;
        }
        #pl-loader .pl-name,
        #pl-loader .pl-role,
        #pl-loader .pl-track {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <script>
      // window.__efLoader.show(mode, { swap, onCovered }) / .ready() — driven by LoaderService.
      (function () {
        // The brand monogram (same geometry as shared/monogram.ts). pathLength="1" lets every stroke
        // draw with the same dash values.
        var MARKUP =
          '<div class="pl-col">' +
          '<svg class="pl-mark" viewBox="0 0 48 48" aria-hidden="true">' +
          '<path class="pl-dia" pathLength="1" d="M24 2.5 L45.5 24 L24 45.5 L2.5 24 Z"/>' +
          '<path class="pl-trace" pathLength="1" d="M24 2.5 L45.5 24 L24 45.5 L2.5 24 Z"/>' +
          '<path class="pl-e pl-e1" pathLength="1" d="M15 14.5 V33.5"/>' +
          '<path class="pl-e pl-e2" pathLength="1" d="M15 15.5 H31"/>' +
          '<path class="pl-e pl-e3" pathLength="1" d="M15 32.5 H31"/>' +
          '<path class="pl-glow" d="M15 24 H45"/>' +
          '<path class="pl-bar" pathLength="1" d="M15 24 H45"/>' +
          '</svg>' +
          '<p class="pl-name">ERIKA FULGENCIO</p>' +
          '<p class="pl-role"></p>' +
          '<div class="pl-track"><div class="pl-fill"></div></div>' +
          '</div>';

        var appReady = false;
        var state = null;

        function show(mode, opt) {
          opt = opt || {};
          var old = document.getElementById('pl-loader');
          if (old) old.remove();
          var d = document.createElement('div');
          d.id = 'pl-loader';
          d.setAttribute('role', 'status');
          d.setAttribute('aria-label', 'Loading');
          // The full assembly plays once per session; reloads and mode swaps use the fast variant.
          var seen = false;
          try {
            seen = sessionStorage.getItem('ef-booted') === '1';
            sessionStorage.setItem('ef-booted', '1');
          } catch (e) {}
          var fast = opt.swap || seen;
          d.className =
            (mode === 'alter' ? 'alter' : 'pro') +
            (opt.swap ? ' enter' : '') +
            (fast ? ' fast' : '');
          d.innerHTML = MARKUP;
          d.querySelector('.pl-role').textContent =
            mode === 'alter' ? 'THE GLITCHBANE \u00b7 LV.08' : 'SENIOR QA ENGINEER';
          document.body.appendChild(d);
          var fill = d.querySelector('.pl-fill');
          var last = 0;
          var t0 = performance.now();
          var minT = opt.swap ? 900 : fast ? 250 : 1400;
          var p = 0;
          var ended = false;
          state = { covered: !opt.swap, swap: !!opt.swap };
          if (opt.swap) {
            d.offsetWidth; // reflow so the fade-in transition runs
            d.classList.remove('enter');
            setTimeout(function () {
              state.covered = true;
              try {
                if (opt.onCovered) opt.onCovered();
              } catch (e) {
                console.error(e);
              }
            }, 380);
          }
          function end() {
            if (ended) return;
            ended = true;
            fill.style.transform = 'scaleX(1)';
            setTimeout(function () {
              d.classList.add('out');
              setTimeout(function () {
                d.remove();
              }, 550);
            }, 160);
          }
          function tick(now) {
            var el = Math.max(0, now - t0); // the first rAF timestamp can predate t0
            var loaded = state.swap || appReady;
            var goal = loaded && state.covered && el > minT ? 1 : Math.min(0.9, el / (minT + 300));
            // Time-based easing: the same pace at 30 or 120 fps, so slow devices don't wait longer.
            var dt = last ? Math.min(100, Math.max(0, now - last)) : 16.67;
            last = now;
            p += (goal - p) * (1 - Math.pow(0.84, dt / 16.67));
            if (goal === 1 && p > 0.995) p = 1;
            fill.style.transform = 'scaleX(' + Math.max(0, p).toFixed(4) + ')';
            if (p >= 1) return end();
            requestAnimationFrame(tick);
          }
          requestAnimationFrame(tick);
          setTimeout(end, 9000);
        }

        window.__efLoader = {
          show: show,
          ready: function () {
            appReady = true;
          },
        };
        show(document.documentElement.getAttribute('data-mode'));
      })();
    </script>
    <app-root></app-root>
    <noscript>This portfolio needs JavaScript to run.</noscript>
  </body>
</html>
