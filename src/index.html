<!doctype html>
<html lang="en" data-mode="pro">
  <head>
    <meta charset="utf-8" />
    <title>Erika Fulgencio · Senior QA Engineer</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Erika Fulgencio — ISTQB-certified Senior QA Engineer and QA Lead in Manila. Projects, case studies, skills and a game-styled alter ego."
    />
    <meta name="theme-color" content="#f2f1f6" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Erika Fulgencio · Senior QA Engineer" />
    <meta
      property="og:description"
      content="There's more to it than meets the eye. Test strategy, QA leadership, automation and AI-driven testing."
    />
    <meta property="og:image" content="assets/img/erika-portrait.jpg" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      // Apply the saved mode before first paint so there is no theme flash.
      (function () {
        var m = 'pro';
        try {
          m = localStorage.getItem('ef-mode') === 'alter' ? 'alter' : 'pro';
        } catch (e) {}
        document.documentElement.setAttribute('data-mode', m);
      })();
    </script>
    <style>
      /* Boot loader: a pixel-art bug split into "what others see" and "what QA sees". */
      #pl-loader {
        --pl-bg: #f2f1f6;
        --pl-glow-1: #c9678f;
        --pl-glow-2: #8b6cea;
        --pl-left: #e6e1f2;
        --pl-right: #fff;
        --pl-bug: #c9678f;
        --pl-pale: #f3d3e0;
        --pl-line: #6d4bd6;
        --pl-scan-2: #8b6cea;
        --pl-edge: #221c33;
        --pl-name: #221c33;
        --pl-sub: #6b6485;
        --pl-msg: #8a84a3;
        --pl-track: #dcd8e8;
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        background: var(--pl-bg);
        transition:
          opacity 0.6s ease 0.3s,
          visibility 0.6s 0.3s;
      }
      #pl-loader.alter {
        --pl-bg: #0c0e1a;
        --pl-glow-1: #ff3c6a;
        --pl-glow-2: #78dcff;
        --pl-left: #0a0c17;
        --pl-right: #151a2e;
        --pl-bug: #ff3c6a;
        --pl-pale: #ffd9e2;
        --pl-line: #78dcff;
        --pl-scan-2: #78dcff;
        --pl-edge: #fff;
        --pl-name: #e9e9ed;
        --pl-sub: #8f93ad;
        --pl-msg: #6f7390;
        --pl-track: #23273d;
      }
      #pl-loader.enter {
        opacity: 0;
        transition: opacity 0.35s ease;
      }
      #pl-loader.out {
        opacity: 0;
        visibility: hidden;
      }
      #pl-loader svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      #pl-loader g {
        transform-box: view-box;
      }
      #pl-loader .pl-L,
      #pl-loader .pl-R,
      #pl-loader .pl-txt {
        transition:
          transform 0.8s cubic-bezier(0.77, 0, 0.18, 1),
          opacity 0.6s ease;
      }
      #pl-loader .pl-card {
        transform-origin: 400px 340px;
        animation: pl-bob 2.6s ease-in-out infinite;
      }
      #pl-loader .pl-fl {
        animation: pl-fl 1.4s steps(2) infinite;
      }
      #pl-loader .pl-scan {
        animation: pl-scan 2.2s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      #pl-loader.out .pl-L {
        transform: translateX(-46px);
        opacity: 0;
      }
      #pl-loader.out .pl-R {
        transform: translateX(46px);
        opacity: 0;
      }
      #pl-loader.out .pl-txt {
        transform: translateY(10px);
        opacity: 0;
      }
      @keyframes pl-fl {
        50% {
          opacity: 0.35;
        }
      }
      @keyframes pl-scan {
        0% {
          transform: translateY(0);
          opacity: 0;
        }
        12%,
        88% {
          opacity: 0.55;
        }
        100% {
          transform: translateY(208px);
          opacity: 0;
        }
      }
      @keyframes pl-bob {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-4px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #pl-loader * {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <script>
      // window.__efLoader.show(mode, { swap, onCovered }) / .ready() — driven by LoaderService.
      (function () {
        // Pixel bug: [x, y, flickerDelay?, pale?] on a 6-unit grid (half-bug, left side).
        var PX = [
          [82, 58],
          [88, 64],
          [88, 70, 0.6],
          [94, 70],
          [82, 76],
          [88, 76],
          [94, 76],
          [76, 82, 0.3],
          [82, 82],
          [88, 82],
          [94, 82],
          [70, 88],
          [76, 88, 0],
          [82, 88],
          [88, 88],
          [94, 88],
          [70, 94],
          [76, 94, 0.6],
          [82, 94],
          [88, 94, null, 1],
          [94, 94],
          [70, 100],
          [76, 100, 0.3],
          [82, 100, null, 1],
          [88, 100],
          [94, 100],
          [70, 106],
          [76, 106, 0],
          [82, 106],
          [88, 106],
          [94, 106],
          [70, 112],
          [76, 112, 0.6],
          [82, 112],
          [88, 112],
          [94, 112],
          [76, 118],
          [82, 118, 0.3],
          [88, 118],
          [94, 118],
          [82, 124],
          [88, 124],
          [94, 124, 0],
          [64, 94],
          [58, 88],
          [64, 106],
          [58, 106],
          [64, 118, 0.6],
          [58, 124],
        ];
        var MONO = 'ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';
        var pixels = PX.map(function (p) {
          var fl = p[2] != null ? ' class="pl-fl" style="animation-delay:' + p[2] + 's"' : '';
          return (
            '<rect' +
            fl +
            ' x="' +
            p[0] +
            '" y="' +
            p[1] +
            '" width="5.4" height="5.4" fill="var(' +
            (p[3] ? '--pl-pale' : '--pl-bug') +
            ')"/>'
          );
        }).join('');
        var BUG = 'transform="translate(400 340) scale(2) translate(-100 -97)"';
        var SVG =
          '<svg viewBox="0 0 800 800" preserveAspectRatio="xMidYMid meet" aria-hidden="true">' +
          '<defs>' +
          '<radialGradient id="pl-g1" gradientUnits="userSpaceOnUse" cx="290" cy="340" r="330"><stop offset="0" stop-color="var(--pl-glow-1)" stop-opacity=".18"/><stop offset="1" stop-color="var(--pl-glow-1)" stop-opacity="0"/></radialGradient>' +
          '<radialGradient id="pl-g2" gradientUnits="userSpaceOnUse" cx="510" cy="340" r="330"><stop offset="0" stop-color="var(--pl-glow-2)" stop-opacity=".17"/><stop offset="1" stop-color="var(--pl-glow-2)" stop-opacity="0"/></radialGradient>' +
          '<linearGradient id="pl-gb" gradientUnits="userSpaceOnUse" x1="330" x2="470" y1="0" y2="0"><stop offset="0" stop-color="var(--pl-bug)"/><stop offset="1" stop-color="var(--pl-line)"/></linearGradient>' +
          '<pattern id="pl-grid" width="10.8" height="10.8" patternUnits="userSpaceOnUse" x="280" y="220"><path d="M10.8 0H0V10.8" fill="none" stroke="var(--pl-line)" stroke-opacity=".1"/></pattern>' +
          '<clipPath id="pl-clip"><rect x="280" y="220" width="240" height="240" rx="30"/></clipPath>' +
          '</defs>' +
          '<rect x="-20000" y="-20000" width="40800" height="40800" fill="url(#pl-g1)"/>' +
          '<rect x="-20000" y="-20000" width="40800" height="40800" fill="url(#pl-g2)"/>' +
          '<g class="pl-card">' +
          '<g class="pl-L" clip-path="url(#pl-clip)"><rect x="280" y="220" width="120" height="240" fill="var(--pl-left)"/><rect x="280" y="220" width="120" height="240" fill="url(#pl-grid)"/><g ' +
          BUG +
          '>' +
          pixels +
          '</g></g>' +
          '<g class="pl-R" clip-path="url(#pl-clip)"><rect x="400" y="220" width="120" height="240" fill="var(--pl-right)"/><g ' +
          BUG +
          ' fill="none" stroke="var(--pl-line)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M100 68A7 7 0 0 1 100 82"/><path d="M100 82A30 24 0 0 1 100 130"/><path d="M104 70Q110 62 117 59"/><path d="M128 95L141 89M130 107H142M126 119L138 126"/><path d="M100 98H122" stroke-opacity=".35"/><circle cx="103" cy="75" r="1.3" fill="var(--pl-line)" stroke="none"/></g></g>' +
          '<g clip-path="url(#pl-clip)"><g class="pl-scan" opacity=".55"><rect x="280" y="236" width="120" height="1.5" fill="var(--pl-bug)"/><rect x="400" y="236" width="120" height="1.5" fill="var(--pl-scan-2)"/></g></g>' +
          '<rect x="280.5" y="220.5" width="239" height="239" rx="29.5" fill="none" stroke="var(--pl-edge)" stroke-opacity=".1"/>' +
          '</g>' +
          '<g class="pl-txt">' +
          '<text x="400" y="516" text-anchor="middle" font-family="Segoe UI,Helvetica Neue,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" letter-spacing="6" fill="var(--pl-name)">ERIKA FULGENCIO</text>' +
          '<text x="400" y="540" text-anchor="middle" font-family="' +
          MONO +
          '" font-size="10" letter-spacing="3.5" fill="var(--pl-sub)">QUALITY ASSURANCE ENGINEER</text>' +
          '<rect x="330" y="566" width="140" height="2" rx="1" fill="var(--pl-track)"/><rect class="pl-bar" x="330" y="566" width="0" height="2" rx="1" fill="url(#pl-gb)"/>' +
          '<text x="400" y="590" text-anchor="middle" font-family="' +
          MONO +
          '" font-size="9" letter-spacing="3" fill="var(--pl-msg)"><tspan class="pl-msg">LOADING</tspan><tspan class="pl-pct" dx="6"></tspan></text>' +
          '</g></svg>';

        var appReady = false;
        var state = null;

        function show(mode, opt) {
          opt = opt || {};
          var old = document.getElementById('pl-loader');
          if (old) old.remove();
          var d = document.createElement('div');
          d.id = 'pl-loader';
          d.setAttribute('role', 'status');
          d.setAttribute('aria-label', 'Loading');
          d.className = (mode === 'alter' ? 'alter' : 'pro') + (opt.swap ? ' enter' : '');
          d.innerHTML = SVG;
          document.body.appendChild(d);
          var bar = d.querySelector('.pl-bar');
          var pct = d.querySelector('.pl-pct');
          var msg = d.querySelector('.pl-msg');
          var t0 = performance.now();
          var minT = opt.swap ? 900 : 1300;
          var p = 0;
          var ended = false;
          state = { covered: !opt.swap, swap: !!opt.swap };
          if (opt.swap) {
            d.offsetWidth; // reflow so the fade-in transition runs
            d.classList.remove('enter');
            setTimeout(function () {
              state.covered = true;
              try {
                if (opt.onCovered) opt.onCovered();
              } catch (e) {
                console.error(e);
              }
            }, 380);
          }
          function end() {
            if (ended) return;
            ended = true;
            msg.textContent = 'READY';
            pct.textContent = '';
            setTimeout(function () {
              d.classList.add('out');
              setTimeout(function () {
                d.remove();
              }, 1200);
            }, 260);
          }
          function tick(now) {
            var el = Math.max(0, now - t0); // the first rAF timestamp can predate t0
            var loaded = state.swap || appReady;
            var goal = loaded && state.covered && el > minT ? 1 : Math.min(0.9, el / (minT + 300));
            p += (goal - p) * 0.08;
            if (goal === 1 && p > 0.995) p = 1;
            bar.setAttribute('width', (140 * Math.max(0, p)).toFixed(1));
            pct.textContent = Math.round(p * 100) + '%';
            if (p >= 1) return end();
            requestAnimationFrame(tick);
          }
          requestAnimationFrame(tick);
          setTimeout(end, 9000);
        }

        window.__efLoader = {
          show: show,
          ready: function () {
            appReady = true;
          },
        };
        show(document.documentElement.getAttribute('data-mode'));
      })();
    </script>
    <app-root></app-root>
    <noscript>This portfolio needs JavaScript to run.</noscript>
  </body>
</html>
